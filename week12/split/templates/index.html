<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            -webkit-appearance: none; /* iOS styling fix */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #2980b9;
        }
        .result-area {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f4fd;
            border-radius: 8px;
            text-align: center;
        }
        .result-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2980b9;
        }
        .error-text {
            color: #e74c3c;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 나눠 내기 계산기</h1>
        <form method="POST">
            <div class="input-group">
                <label for="total_amount">총 금액 (원)</label>
                <input type="number" id="total_amount" name="total_amount" placeholder="예: 50000" required inputmode="numeric">
            </div>
            <div class="input-group">
                <label for="people_count">인원 수 (명)</label>
                <input type="number" id="people_count" name="people_count" placeholder="예: 4" required inputmode="numeric">
            </div>
            <button type="submit">계산하기</button>
        </form>

        {% if result is not none %}
            <div class="result-area">
                {% if result is number %}
                    <div>1인당 금액은</div>
                    <div class="result-text">{{ "{:,.0f}".format(result) }} 원</div>
                {% else %}
                    <div class="error-text">{{ result }}</div>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
