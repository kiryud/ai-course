<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>할 일 관리</h1>
        
        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="새로운 할 일을 입력하세요" required>
            <button type="submit">추가</button>
        </form>

        <ul class="todo-list">
            {% for todo in todos %}
            <li>
                <span>{{ todo.title }}</span>
                <!-- 완료/삭제 버튼은 2단계에서 구현 -->
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
