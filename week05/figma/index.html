<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 화면</title>
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Login Screen Container */
        .login-screen {
            width: 100%;
            max-width: 390px; /* Designed width from Figma */
            min-height: 844px; /* Designed height from Figma */
            padding: 72px 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            background-color: #FFFFFF;
        }

        /* Header Section */
        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1C2430;
            text-align: left;
        }

        .header p {
            font-size: 15px;
            font-weight: 400;
            color: #667085;
            text-align: left;
        }

        /* Form Section */
        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #667085;
        }

        .input-container {
            display: flex;
            padding: 14px;
            background-color: #F7F7FA;
            border: 1px solid #DEE3E8;
            border-radius: 10px;
        }

        .input-container input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #667085;
        }

        .input-container input::placeholder {
            color: #667085;
        }

        /* Button Section */
        .primary-button {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 0;
            background-color: #2663EB;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Footer Section */
        .footer {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: auto; /* Push to bottom if needed, though padding handles it */
        }

        .footer span {
            font-size: 14px;
        }

        .footer .text-secondary {
            color: #667085;
            font-weight: 400;
        }

        .footer .text-primary {
            color: #2663EB;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-screen">
        <!-- Header -->
        <header class="header">
            <h1>다시 만나서 반갑습니다</h1>
            <p>학교 이메일로 로그인하세요</p>
        </header>

        <!-- Form -->
        <div class="form">
            <!-- Email Field -->
            <div class="field-group">
                <label class="field-label">이메일</label>
                <div class="input-container">
                    <input type="email" placeholder="아이디@daelim.ac.kr">
                </div>
            </div>

            <!-- Password Field -->
            <div class="field-group">
                <label class="field-label">비밀번호</label>
                <div class="input-container">
                    <input type="password" placeholder="8자 이상">
                </div>
            </div>
        </div>

        <!-- Button -->
        <button class="primary-button">로그인</button>

        <!-- Footer -->
        <footer class="footer">
            <span class="text-secondary">계정이 없으신가요?</span>
            <span class="text-primary">회원가입</span>
        </footer>
    </div>

</body>
</html>
