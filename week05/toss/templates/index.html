<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>토스페이먼츠 주문서형 결제 테스트</title>
    <script src='https://js.tosspayments.com/v2/standard'></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #payment-method, #agreement { border: 1px solid #eee; padding: 10px; margin-bottom: 20px; border-radius: 8px; }
        button { padding: 10px 20px; background-color: #0064ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <h1>주문서형 결제 테스트</h1>
    <div id='payment-method'></div>
    <div id='agreement'></div>
    <button id='pay-button'>결제하기</button>

    <script>
        const clientKey = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
        const customerKey = TossPayments.ANONYMOUS;

        async function initPayment() {
            try {
                const tossPayments = TossPayments(clientKey);
                const widgets = tossPayments.widgets({ customerKey });

                await widgets.setAmount({
                    currency: 'KRW',
                    value: 1000
                });

                await Promise.all([
                    widgets.renderPaymentMethods({
                        selector: '#payment-method',
                        variantKey: 'DEFAULT'
                    }),
                    widgets.renderAgreement({
                        selector: '#agreement',
                        variantKey: 'AGREEMENT'
                    })
                ]);

                document.getElementById('pay-button').onclick = async () => {
                    const orderId = 'ORDER_' + Math.random().toString(36).substring(2, 11);
                    const orderName = '테스트 상품';
                    const successUrl = window.location.origin + '/success';
                    const failUrl = window.location.origin + '/fail';

                    try {
                        await widgets.requestPayment({
                            orderId,
                            orderName,
                            successUrl,
                            failUrl
                        });
                    } catch (e) {
                        console.error(e);
                        alert('결제 요청 중 에러 발생: ' + e.message);
                    }
                };

            } catch (error) {
                console.error('초기화 에러:', error);
            }
        }
        initPayment();
    </script>
</body>
</html>
